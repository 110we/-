name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kalidroid-ops-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to Release (nightly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly app/build/outputs/apk/debug/*.apk \
            --title "KaliDroid Nightly" \
            --notes "自动构建 APK（每次 push 到 main 更新）" \
            --prerelease
