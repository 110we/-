name: Diag
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973" >/dev/null

      - name: Run gradle with full output
        id: gradle
        continue-on-error: true
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon > /tmp/gradle.log 2>&1
          echo "exit=$?" >> $GITHUB_OUTPUT
          echo "code=$?" > /tmp/code.txt

      - name: Summarize
        run: |
          {
            echo "### gradle exit: $(cat /tmp/code.txt)"
            echo '```'
            tail -120 /tmp/gradle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
